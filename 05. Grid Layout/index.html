<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3 , 100px) 50px 50px;
            gap: 20px
            ;
        }
        #box-1{
            grid-row: span 5;
        }

        #box-11,#box-12{
            grid-column: span 3;
        }
        .box{
            background-color: tomato;
        }

        @media screen and (max-width: 576px) {
            .container{
                /* grid-template-columns: repeat(4 ,1fr); */
                grid-template-rows: repeat(12, 100px);
            }
            #box-1,#box-11,#box-12{
                grid-column: auto;
                grid-row: auto;
            }
        }
    </style>
</head>


<body>
    <div class="container">
        <div class="box" id="box-1">Box-^</div>
        <div class="box" id="box-2">Box-^</div>
        <div class="box" id="box-3">Box-^</div>
        <div class="box" id="box-4">Box-^</div>
        <div class="box" id="box-5">Box-^</div>
        <div class="box" id="box-6">Box-^</div>
        <div class="box" id="box-7">Box-^</div>
        <div class="box" id="box-8">Box-^</div>
        <div class="box" id="box-9">Box-^</div>
        <div class="box" id="box-10">Box-^</div>
        <div class="box" id="box-11">Box-^</div>
        <div class="box" id="box-12">Box-^</div>
    </div>
</body>
</html>
